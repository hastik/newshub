name: Validate Articles

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'articles/**'
      - 'studies/**'
      - 'tasks/**'
      - 'tags.yml'
      - 'scripts/check.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: pip install pyyaml
    
    - name: Run validation
      run: python scripts/check.py
